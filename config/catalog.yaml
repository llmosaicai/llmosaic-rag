version: 1
stack_key: llmosaic-rag
description: >-
  Configuration variables required by the llmosaic-rag stack (umbrella over llmosaic-db),
  including whether they are secrets and whether they can be auto-populated. This catalog
  is used by the frontend to present a profile editor and by the provisioner to render
  Secrets and Helm overrides.

variables:
  # ---- Notebook and Proxy wiring ----
  - name: PROXY_HOST
    description: FQDN for the tenant PostgREST-Proxy ingress (used to form PROXY_BASE).
    secret: false
    auto: true
    source:
      type: chart_computed
      note: Derived from llmosaic-db.ingress.hostTemplate or proxy.host for this tenant.
    inject:
      write_env: true
      containers:
        - name: jupyterlab
          env: PROXY_HOST

  - name: SCHEMA_NAME
    description: PostgreSQL schema to use for RAG tables. For the Film DB demo, this is scoped to 'filmdata1'.
    secret: false
    auto: true
    default: filmdata1
    inject:
      write_env: true

  # ---- LLM API access (auto from owner keys) ----
  - name: LLMAPI_BASE
    description: Base URL for the LLM API gateway (embed + chat endpoints).
    secret: false
    auto: true
    source:
      type: values
      path: rag.llmapi.baseUrl
    inject:
      write_env: true
      containers:
        - name: jupyterlab
          env: LLMAPI_BASE

  - name: LLMAPI_ACCESS_KEY_ID
    description: Access key id for LLM API (non-secret).
    secret: false
    auto: true
    inject:
      write_env: true

  - name: LLMAPI_SECRET_ACCESS_KEY
    description: Secret access key for LLM API.
    secret: true
    auto: true
    k8s:
      secretRef:
        name: rag-llmapi
        key: LLMAPI_SECRET_ACCESS_KEY
    inject:
      write_env: true
      envFromSecrets:
        - rag-llmapi

  - name: LLMAPI_MODEL_NAMES
    description: Comma-separated list of chat model names enabled by the access key.
    secret: false
    auto: true
    inject:
      write_env: true

  - name: LLMAPI_COMPLETION_MODEL
    description: Default chat completion model (first in LLMAPI_MODEL_NAMES when auto).
    secret: false
    auto: true
    inject:
      write_env: true

  - name: LLMAPI_EMBED_MODEL
    description: Embedding model name (e.g., titan-embed-text-v2).
    secret: false
    auto: true
    default: titan-embed-text-v2
    inject:
      write_env: true

  - name: LLMAPI_VECTOR_DIMENSION
    description: Embedding vector dimension for the selected embed model.
    secret: false
    auto: true
    default: 1024
    inject:
      write_env: true

  - name: LLMAPI_API_KEY
    description: "Token for chat (/completions): AKID:SECRET:LLMAPI_COMPLETION_MODEL."
    secret: true
    auto: true
    k8s:
      secretRef:
        name: rag-llmapi
        key: LLMAPI_API_KEY
    inject:
      write_env: true
      envFromSecrets:
        - rag-llmapi

  - name: LLMAPI_EMBED_KEY
    description: "Token for embeddings (/embeddings): AKID:SECRET:LLMAPI_EMBED_MODEL."
    secret: true
    auto: true
    k8s:
      secretRef:
        name: rag-llmapi
        key: LLMAPI_EMBED_KEY
    inject:
      write_env: true
      envFromSecrets:
        - rag-llmapi

  # Backward-compat alias used by older examples
  - name: LLM_NAME
    description: Compat alias for LLMAPI_COMPLETION_MODEL.
    secret: false
    auto: true
    inject:
      write_env: true

  # ---- User storage access (used by PostgREST-Proxy auth for notebook flows) ----
  - name: STORAGE_ACCESS_KEY_ID
    description: User access key id for the storage gateway (Mosaic-style access keys).
    secret: false
    auto: true
    source:
      type: backend
      key: user_storage_key_id
    k8s:
      secretRef:
        name: rag-proxy-auth
        key: STORAGE_ACCESS_KEY_ID
    inject:
      write_env: true
      envFromSecrets:
        - rag-proxy-auth

  - name: STORAGE_SECRET_ACCESS_KEY
    description: User storage secret access key.
    secret: true
    auto: true
    source:
      type: backend
      key: user_storage_key_secret
    k8s:
      secretRef:
        name: rag-proxy-auth
        key: STORAGE_SECRET_ACCESS_KEY
    inject:
      write_env: true
      envFromSecrets:
        - rag-proxy-auth

notes:
  - The provisioner should auto-populate chart values and Secrets according to this catalog
    when a config profile is selected during deployment creation.
  - The Jupyter write-env init container writes a filtered subset into /home/jovyan/work/.rag/.env.
