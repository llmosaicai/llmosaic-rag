summary: |
  This guided RAG test provisions a simple table in the tenant PostgREST-Proxy,
  drops it if it exists, creates it, builds a vector index, inserts a few rows
  with embeddings generated by the selected embedding model, performs a vector
  similarity search for a query, and finally calls a chat model with the retrieved
  context.
default_schema: public

steps:
  - id: health_check
    title: Health Check
    purpose: Verify the tenant PostgREST-Proxy is reachable and ready.
    action: http_get
    endpoint: /healthz

  - id: drop_table
    title: Drop Table (if exists)
    purpose: Ensure a clean state by dropping the table if it already exists.
    action: drop_table
    params:
      table_name: items5

  - id: create_table
    title: Create Table
    purpose: Create a table to store raw text and its embedding vector.
    action: create_table
    params:
      table_name: items5
      not_exists: true
      columns:
        - { name: id, type: bigserial, constraints: PRIMARY KEY }
        - { name: text, type: text }
        - { name: embedding, type: vector(1024) }

  - id: create_vector_index
    title: Create Vector Index (HNSW)
    purpose: Build a HNSW cosine index on the embedding column for fast similarity search.
    action: create_vector_index
    params:
      table_name: items5
      vector_column: embedding
      index_type: hnsw
      distance_operator: vector_cosine_ops

  - id: embed_and_insert
    title: Embed + Insert Sample Rows
    purpose: Generate embeddings for sample texts and insert rows into the table.
    action: embed_and_insert
    params:
      table_name: items5
      texts:
        - Hello world
        - The quick brown fox jumps over the lazy dog
        - RAG playground sample text

  - id: vector_query
    title: Vector Query
    purpose: Embed the query text and find the closest row by cosine distance.
    action: vector_query
    params:
      table_name: items5
      query_text: What did the fox jump over?
      limit: 1

  - id: chat_with_context
    title: Chat with Retrieved Context
    purpose: Call the chat model using the retrieved text as grounding context.
    action: chat_with_context
    params:
      template: |
        Based on the following context: "{{context}}", answer the question: "{{question}}"
      question: What did the fox jump over?

