# Values that overlay the llmosaic-db subchart and add RAG-specific config

llmosaic-db:
  org: example
  pgadmin:
    enabled: true

# RAG integration values
rag:
  llmapi:
    baseUrl: https://llmapi6.llmosaic.ai
    # Reference to a Secret containing API keys or tokens for llmapi
    secretRef:
      name: rag-llmapi
      key: API_KEY

# Optional JupyterLab (moved from db stack)
jupyterlab:
  enabled: false
  image: jupyter/minimal-notebook:python-3.11
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  pvc:
    size: 5Gi
  hostTemplate: "jupyter-{{ .Values.llmosaic-db.org }}.tenants.llmosaic.ai"
  envFromSecrets: []

# Egress policy controls for RAG components (e.g., Jupyter)
# - When restricted=false (default), the chart does not install namespace-wide
#   egress policies that would implicitly restrict all pods. Egress remains open
#   unless constrained by additional NetworkPolicies.
# - When restricted=true, the chart scopes DNS egress and optionally allows
#   JupyterLab to reach common internet ports (443/80) so extensions and
#   external services work.
egress:
  restricted: false
  # Only used when restricted=true
  internetForJupyter: true
