# Values that overlay the llmosaic-db subchart and add RAG-specific config

llmosaic-db:
  org: example
  pgadmin:
    enabled: true

# RAG integration values
rag:
  llmapi:
    baseUrl: https://llmapi6.llmosaic.ai
    # Reference to a Secret containing API keys or tokens for llmapi
    secretRef:
      name: rag-llmapi
      key: API_KEY

# Optional JupyterLab (moved from db stack)
jupyterlab:
  enabled: false
  image: jupyter/minimal-notebook:python-3.11
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  pvc:
    size: 5Gi
  hostTemplate: "jupyter-{{ .Values.llmosaic-db.org }}.tenants.llmosaic.ai"
  envFromSecrets: []
