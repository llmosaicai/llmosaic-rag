# Values that overlay the llmosaic-db subchart and add RAG-specific config

llmosaic-db:
  org: example
  pgadmin:
    enabled: true

# RAG integration values
rag:
  llmapi:
    baseUrl: https://llmapi6.llmosaic.ai
    # Reference to a Secret containing API keys or tokens for llmapi
    secretRef:
      # Do not default to a secret name; the provisioner/profile will
      # append any required secrets to jupyterlab.envFromSecrets.
      # Leaving this empty avoids pod startup failures when no profile
      # is selected and the Secret does not exist yet.
      name: ""
      key: API_KEY
  # Example artifacts (fixtures, notebooks, specs) to seed into postgrest-proxy /artifacts
  examples:
    enabled: true
    # Prefer remote fetch of examples/specs and fixture (no assets image)
    source: remote  # image|configmap|remote|dvc
    remote:
      files:
        # Specs from GitHub main (raw)
        - url: https://raw.githubusercontent.com/llmosaicai/llmosaic-rag/main/assets/specs/manifest.yaml
          to: /artifacts/specs/manifest.yaml
        - url: https://raw.githubusercontent.com/llmosaicai/llmosaic-rag/main/assets/specs/film_db_rag.yaml
          to: /artifacts/specs/film_db_rag.yaml
        # Notebook (optional): copy into artifacts; Jupyter can open from there
        - url: https://raw.githubusercontent.com/llmosaicai/llmosaic-rag/main/assets/notebooks/film_db_rag.ipynb
          to: /artifacts/notebooks/film_db_rag.ipynb
        # Film DB SQL fixture published via GitHub Releases
        - url: https://github.com/llmosaicai/llmosaic-rag/releases/download/v0.1.0/film_db_backup.sql
          to: /artifacts/film_db_backup.sql
          sha256: f5a03f7a91f61021315d13910d717e162a109fe5f0a8afe1a8cb5c632cff60d7
    # For very small files, you can also embed directly via configmap
    files: []

# Optional JupyterLab (moved from db stack)
jupyterlab:
  enabled: true
  image: jupyter/minimal-notebook:python-3.11
  preload:
    enabled: false
    source: inline   # image|inline
    image: ""
    notebooks: []   # used when source=inline (small content)
  envDump:
    enabled: true
  # Optional extra environment variables injected into both the write-env init
  # container and the main Jupyter container. Useful for passing non-secret
  # defaults (e.g., EMBED_NAME/MODEL, LLM_NAME/MODEL, SCHEMA_NAME, USER_EMAIL)
  extraEnv: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  pvc:
    size: 5Gi
  hostTemplate: "jupyter-{{ (index .Values \"llmosaic-db\").org }}.tenants.llmosaic.ai"
  envFromSecrets: []
  ingress:
    middlewares: []
  sso:
    enabled: true
    # OIDC issuer (backend discovery base)
    issuerUrl: ""
    # Reference to Secret with keys: CLIENT_ID, CLIENT_SECRET, COOKIE_SECRET
    secretRef:
      name: jupyter-oidc
    # Extra oauth2-proxy args (e.g., ["--cookie-expire=8h","--cookie-refresh=30m"]) 
    extraArgs: []

# Optional Traefik ForwardAuth middleware for non-OIDC services (uses oauth2-proxy auth endpoint)
sso:
  forwardAuth:
    enabled: false
    # Name for the tenant-scoped Middleware (created when enabled)
    name: oauth2-forwardauth

# Egress policy controls for RAG components (e.g., Jupyter)
# - When restricted=false (default), the chart does not install namespace-wide
#   egress policies that would implicitly restrict all pods. Egress remains open
#   unless constrained by additional NetworkPolicies.
# - When restricted=true, the chart scopes DNS egress and optionally allows
#   JupyterLab to reach common internet ports (443/80) so extensions and
#   external services work.
egress:
  restricted: false
  # Only used when restricted=true
  internetForJupyter: true

deps:
  llmosaic_db:
    repo_url: "https://github.com/llmosaicai/llmosaic-db"
    repo_ref: "main"
    chart_path: "chart/llmosaic-db"
    vendor: true
