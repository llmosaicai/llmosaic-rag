{{- $ws := .Values.rag.workspace -}}
{{- if and $ws $ws.repos (gt (len $ws.repos) 0) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-repos
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $ws.pvc.size | default "2Gi" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workspace-repos-clone
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: clone
          image: alpine:3.19
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: TOKEN
                  # Require the Secret so private repo downloads work; pod will wait until Secret exists
                  optional: false
          {{- /* No envFrom needed; we only use GITHUB_TOKEN directly when present */}}
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /ws
              fetch_repo() {
                name="$1"; url="$2"; ref="${3:-main}"
                echo "[fetch] $name from $url@$ref"
                d="/ws/$name"; rm -rf "$d" && mkdir -p "$d"
                base="$(echo "$url" | sed -n 's#https://github.com/\(.*\)/\(.*\)\.git#https://codeload.github.com/\1/\2#p; s#https://github.com/\(.*\)/\(.*\)$#https://codeload.github.com/\1/\2#p')"
                tarurl="$base/tar.gz/refs/heads/$ref"
                if [ -n "${GITHUB_TOKEN:-}" ]; then wget -qO /tmp/${name}.tgz --header="Authorization: token ${GITHUB_TOKEN}" "$tarurl"; else wget -qO /tmp/${name}.tgz "$tarurl"; fi
                tar -xzf /tmp/${name}.tgz -C "$d" --strip-components=1
              }
              {{- range $r := $ws.repos }}
              fetch_repo {{ $r.name | quote }} {{ $r.repo_url | quote }} {{ $r.repo_ref | default "main" | quote }}
              {{- end }}
              # Large SQL asset is delivered via DVC to /artifacts; do not fetch here
              ls -la /ws || true
          volumeMounts:
            - name: ws
              mountPath: /ws
      volumes:
        - name: ws
          persistentVolumeClaim:
            claimName: workspace-repos
{{- end }}
