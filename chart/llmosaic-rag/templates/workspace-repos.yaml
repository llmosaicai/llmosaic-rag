{{- $ws := .Values.rag.workspace -}}
{{- if and $ws $ws.repos (gt (len $ws.repos) 0) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-repos
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $ws.pvc.size | default "2Gi" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workspace-repos-clone
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: clone
          image: alpine:3.19
          env:
            - name: CLONE_MODE
              value: {{ ($ws.cloneMode | default "tar") | quote }}
          {{- /* No envFrom needed; we only use GITHUB_TOKEN directly when present */}}
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /ws
              if [ "${CLONE_MODE:-tar}" = "git" ]; then
                echo "[setup] installing git for clone mode"
                apk add --no-cache git ca-certificates >/dev/null 2>&1 || true
              fi
              fetch_repo() {
                name="$1"; url="$2"; ref="${3:-main}"
                echo "[fetch] $name from $url@$ref"
                d="/ws/$name"; rm -rf "$d" && mkdir -p "$d"
                base="$(echo "$url" | sed -n 's#https://github.com/\(.*\)/\(.*\)\.git#https://codeload.github.com/\1/\2#p; s#https://github.com/\(.*\)/\(.*\)$#https://codeload.github.com/\1/\2#p')"
                tarurl="$base/tar.gz/refs/heads/$ref"
                wget -qO /tmp/${name}.tgz "$tarurl"
                tar -xzf /tmp/${name}.tgz -C "$d" --strip-components=1
              }
              clone_repo() {
                name="$1"; url="$2"; ref="${3:-main}"
                echo "[clone] $name from $url@$ref"
                d="/ws/$name"; rm -rf "$d" && mkdir -p "$d"
                git clone --depth 1 --branch "$ref" "$url" "$d"
              }
              {{- range $r := $ws.repos }}
              if [ "${CLONE_MODE:-tar}" = "git" ]; then
                clone_repo {{ $r.name | quote }} {{ $r.repo_url | quote }} {{ $r.repo_ref | default "main" | quote }}
              else
                fetch_repo {{ $r.name | quote }} {{ $r.repo_url | quote }} {{ $r.repo_ref | default "main" | quote }}
              fi
              {{- end }}
              # Large SQL asset is delivered via DVC to /artifacts; do not fetch here
              # Ensure dev user (uid/gid 1000) can write to the workspace repos
              chown -R 1000:1000 /ws || true
              ls -la /ws || true
          volumeMounts:
            - name: ws
              mountPath: /ws
      volumes:
        - name: ws
          persistentVolumeClaim:
            claimName: workspace-repos
{{- end }}
