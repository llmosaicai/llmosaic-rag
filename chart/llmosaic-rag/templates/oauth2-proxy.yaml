{{- if .Values.jupyterlab.enabled }}
{{- if .Values.jupyterlab.sso.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ required "jupyterlab.sso.issuerUrl required" .Values.jupyterlab.sso.issuerUrl | quote }}
            - --redirect-url=https://{{ tpl (.Values.jupyterlab.hostTemplate | default (print "jupyter-" .Values.llmosaic-db.org ".tenants.llmosaic.ai")) . }}/oauth2/callback
            - --client-id=$(CLIENT_ID)
            - --client-secret=$(CLIENT_SECRET)
            - --cookie-secret=$(COOKIE_SECRET)
            - --cookie-secure=true
            - --email-domain=*
            - --upstream=http://jupyterlab:8888
            - --http-address=0.0.0.0:4180
            {{- range $arg := .Values.jupyterlab.sso.extraArgs | default (list) }}
            - {{ $arg | quote }}
            {{- end }}
          env:
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jupyterlab.sso.secretRef.name | default "jupyter-oidc" | quote }}
                  key: CLIENT_ID
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jupyterlab.sso.secretRef.name | default "jupyter-oidc" | quote }}
                  key: CLIENT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jupyterlab.sso.secretRef.name | default "jupyter-oidc" | quote }}
                  key: COOKIE_SECRET
          ports:
            - containerPort: 4180
{{- end }}
{{- end }}

