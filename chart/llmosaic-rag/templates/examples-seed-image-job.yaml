{{- if and .Values.rag .Values.rag.examples .Values.rag.examples.enabled (eq (lower (.Values.rag.examples.source | default "configmap")) "image") (ne (default "" .Values.rag.examples.image) "") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-examples-seed-image
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: {{ .Values.rag.examples.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: EXAMPLES_IMAGE
              value: {{ .Values.rag.examples.image | quote }}
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              mkdir -p /artifacts
              if [ -d /assets ]; then
                # Clear prior specs/notebooks so order/content cannot remain stale across image updates
                rm -rf /artifacts/specs || true
                rm -rf /artifacts/notebooks || true
                mkdir -p /artifacts/specs /artifacts/notebooks
                cp -r /assets/* /artifacts/ || true
                # Stamp seed info so we can diagnose which image populated artifacts
                echo "${EXAMPLES_IMAGE}" > /artifacts/specs/SEED_IMAGE.txt || true
                if [ -f /assets/specs/COMMIT.txt ]; then cp /assets/specs/COMMIT.txt /artifacts/specs/COMMIT.txt || true; fi
                ls -l /artifacts || true
              else
                echo "No /assets directory in image; nothing to seed." >&2
              fi
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: proxy-artifacts
{{- end }}
