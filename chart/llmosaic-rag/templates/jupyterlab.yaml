{{- if .Values.jupyterlab.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterlab-data
  labels:
    app: jupyterlab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.jupyterlab.pvc.size | default "5Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterlab
  labels:
    app: jupyterlab
spec:
  selector:
    app: jupyterlab
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterlab
  labels:
    app: jupyterlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyterlab
  template:
    metadata:
      labels:
        app: jupyterlab
    spec:
      initContainers:
        {{- if and .Values.jupyterlab.envDump .Values.jupyterlab.envDump.enabled }}
        - name: write-env
          image: alpine:3.19
          securityContext:
            runAsUser: 1000
            runAsGroup: 100
          # Make selected values available to the init via env
          env:
            {{- with (index .Values "llmosaic-db").proxy }}
            - name: PROXY_HOST
              value: {{ .host | quote }}
            {{- end }}
            {{- with .Values.rag.llmapi.baseUrl }}
            - name: LLMAPI_BASE
              value: {{ . | quote }}
            {{- end }}
            {{- range $e := .Values.jupyterlab.extraEnv | default (list) }}
            - name: {{ $e.name | quote }}
              value: {{ $e.value | quote }}
            {{- end }}
          # Pass through declared Secrets so write-env can dump them into .env
          envFrom:
          {{- range $s := .Values.jupyterlab.envFromSecrets | default (list) }}
            - secretRef:
                name: {{ $s | quote }}
          {{- end }}
          {{- with .Values.rag.llmapi.secretRef.name }}
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              dest=/home/jovyan/work/.rag
              mkdir -p "$dest"
              {
                printenv | grep -E '^(LLMAPI_BASE|LLMAPI_API_KEY|LLMAPI_EMBED_KEY|LLMAPI_ACCESS_KEY_ID|LLMAPI_SECRET_ACCESS_KEY|LLMAPI_MODEL_NAMES|LLMAPI_COMPLETION_MODEL|LLMAPI_EMBED_MODEL|LLMAPI_VECTOR_DIMENSION|USER_EMAIL|STORAGE_ACCESS_KEY_ID|STORAGE_SECRET_ACCESS_KEY|PROXY_HOST|LLM_NAME|SCHEMA_NAME)='
              } > "$dest/.env" || true
              chmod 600 "$dest/.env" || true
          volumeMounts:
            - name: data
              mountPath: /home/jovyan/work
        {{- end }}
        {{- if and .Values.jupyterlab.preload .Values.jupyterlab.preload.enabled (eq (lower (.Values.jupyterlab.preload.source | default "inline")) "inline") (gt (len (.Values.jupyterlab.preload.notebooks | default (list))) 0) }}
        - name: preload-notebooks-inline
          image: alpine:3.19
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              mkdir -p /preload
              {{- range $i, $f := .Values.jupyterlab.preload.notebooks }}
              cat >/preload/{{ $f.name | quote }} <<'EOF_{{ $i }}'
{{ $f.content | nindent 0 }}
EOF_{{ $i }}
              install -D -m 0644 /preload/{{ $f.name }} {{ $f.destPath }}
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /home/jovyan/work
        {{- end }}
        {{/* Removed preload-notebooks-image to eliminate assets image pathway */}}
        {{- if and .Values.rag.workspace .Values.rag.workspace.repos (gt (len .Values.rag.workspace.repos) 0) (and .Values.rag.workspace.mounts .Values.rag.workspace.mounts.jupyterlab .Values.rag.workspace.mounts.jupyterlab.enabled) }}
        - name: wait-workspace
          image: alpine:3.19
          securityContext:
            runAsUser: 1000
            runAsGroup: 100
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              # Wait for the workspace repo to appear and contain specs
              MOUNT={{ .Values.rag.workspace.mounts.jupyterlab.mountPath | default "/home/jovyan/work/repos" | quote }}
              REPO={{ ((index .Values "llmosaic-db").proxy.symlinkSpecsFromWorkspace.repoName | default "llmosaic-rag") | quote }}
              TARGET="$MOUNT/$REPO/assets/specs"
              echo "Waiting for workspace at: $TARGET"
              tries=120
              while [ $tries -gt 0 ]; do
                if [ -d "$TARGET" ] && [ "$(ls -A "$TARGET" 2>/dev/null || true)" ]; then
                  echo "Workspace ready: $TARGET"
                  break
                fi
                tries=$((tries-1))
                sleep 2
              done
              if [ $tries -le 0 ]; then
                echo "Proceeding without specs; workspace not ready after wait"
              fi
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.rag.workspace.mounts.jupyterlab.mountPath | default "/home/jovyan/work/repos" | quote }}
        {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jupyterlab
          image: {{ .Values.jupyterlab.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: data
              mountPath: /home/jovyan/work
            {{- if and .Values.rag.workspace .Values.rag.workspace.mounts .Values.rag.workspace.mounts.jupyterlab .Values.rag.workspace.mounts.jupyterlab.enabled }}
            - name: workspace
              mountPath: {{ .Values.rag.workspace.mounts.jupyterlab.mountPath | default "/home/jovyan/work/repos" | quote }}
            {{- end }}
            # Mount proxy artifacts so notebooks can access /artifacts
            - name: artifacts
              mountPath: /artifacts
          env:
            {{- if .Values.jupyterlab.sso.enabled }}
            - name: NOTEBOOK_ARGS
              value: "--ServerApp.token='' --ServerApp.password=''"
            {{- end }}
            {{- with (index .Values "llmosaic-db").proxy }}
            - name: PROXY_HOST
              value: {{ .host | quote }}
            {{- end }}
            {{- with .Values.rag.llmapi.baseUrl }}
            - name: LLMAPI_BASE
              value: {{ . | quote }}
            {{- end }}
            {{- range $e := .Values.jupyterlab.extraEnv | default (list) }}
            - name: {{ $e.name | quote }}
              value: {{ $e.value | quote }}
            {{- end }}
          envFrom:
          {{- range $s := .Values.jupyterlab.envFromSecrets | default (list) }}
            - secretRef:
                name: {{ $s | quote }}
          {{- end }}
          {{- with .Values.rag.llmapi.secretRef.name }}
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.jupyterlab.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jupyterlab-data
        {{- if and .Values.rag.workspace .Values.rag.workspace.repos (gt (len .Values.rag.workspace.repos) 0) (and .Values.rag.workspace.mounts .Values.rag.workspace.mounts.jupyterlab .Values.rag.workspace.mounts.jupyterlab.enabled) }}
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-repos
        {{- end }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: proxy-artifacts
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyterlab
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- if .Values.jupyterlab.ingress.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," .Values.jupyterlab.ingress.middlewares | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ tpl (.Values.jupyterlab.hostTemplate | default (print "jupyter-" (index .Values "llmosaic-db").org ".tenants.llmosaic.ai")) . | quote }}
      secretName: {{ .Values.ingress.secretName | default "tenant-combined-tls" | quote }}
  rules:
    - host: {{ tpl (.Values.jupyterlab.hostTemplate | default (print "jupyter-" (index .Values "llmosaic-db").org ".tenants.llmosaic.ai")) . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ if .Values.jupyterlab.sso.enabled }}oauth2-proxy{{ else }}jupyterlab{{ end }}
                port:
                  number: {{ if .Values.jupyterlab.sso.enabled }}4180{{ else }}8888{{ end }}
{{- end }}
