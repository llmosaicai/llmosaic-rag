{{- if .Values.jupyterlab.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterlab-data
  labels:
    app: jupyterlab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.jupyterlab.pvc.size | default "5Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterlab
  labels:
    app: jupyterlab
spec:
  selector:
    app: jupyterlab
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterlab
  labels:
    app: jupyterlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyterlab
  template:
    metadata:
      labels:
        app: jupyterlab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jupyterlab
          image: {{ .Values.jupyterlab.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: data
              mountPath: /home/jovyan/work
          env:
            {{- if .Values.jupyterlab.sso.enabled }}
            - name: NOTEBOOK_ARGS
              value: "--ServerApp.token='' --ServerApp.password=''"
            {{- end }}
          envFrom:
          {{- range $s := .Values.jupyterlab.envFromSecrets | default (list) }}
            - secretRef:
                name: {{ $s | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.jupyterlab.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jupyterlab-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyterlab
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- if .Values.jupyterlab.ingress.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," .Values.jupyterlab.ingress.middlewares | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ tpl (.Values.jupyterlab.hostTemplate | default (print "jupyter-" (index .Values "llmosaic-db").org ".tenants.llmosaic.ai")) . | quote }}
      secretName: {{ .Values.ingress.secretName | default "tenant-combined-tls" | quote }}
  rules:
    - host: {{ tpl (.Values.jupyterlab.hostTemplate | default (print "jupyter-" (index .Values "llmosaic-db").org ".tenants.llmosaic.ai")) . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ if .Values.jupyterlab.sso.enabled }}oauth2-proxy{{ else }}jupyterlab{{ end }}
                port:
                  number: {{ if .Values.jupyterlab.sso.enabled }}4180{{ else }}8888{{ end }}
{{- end }}
