{{- if .Values.jupyterlab.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterlab-data
  labels:
    app: jupyterlab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.jupyterlab.pvc.size | default "5Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterlab
  labels:
    app: jupyterlab
spec:
  selector:
    app: jupyterlab
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterlab
  labels:
    app: jupyterlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyterlab
  template:
    metadata:
      labels:
        app: jupyterlab
    spec:
      initContainers:
        {{- if and .Values.jupyterlab.envDump .Values.jupyterlab.envDump.enabled }}
        - name: write-env
          image: alpine:3.19
          securityContext:
            runAsUser: 1000
            runAsGroup: 100
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              dest=/home/jovyan/work/.rag
              mkdir -p "$dest"
              {
                printenv | grep -E '^(LLMAPI_BASE|LLMAPI_API_KEY|USER_EMAIL|STORAGE_ACCESS_KEY_ID|STORAGE_SECRET_ACCESS_KEY|PROXY_HOST|EMBED_NAME|EMBED_MODEL|LLM_NAME|LLM_MODEL|SCHEMA_NAME)='
              } > "$dest/.env" || true
              chmod 600 "$dest/.env" || true
          volumeMounts:
            - name: data
              mountPath: /home/jovyan/work
        {{- end }}
        {{- if and .Values.jupyterlab.preload .Values.jupyterlab.preload.enabled (eq (lower (.Values.jupyterlab.preload.source | default "inline")) "inline") (gt (len (.Values.jupyterlab.preload.notebooks | default (list))) 0) }}
        - name: preload-notebooks-inline
          image: alpine:3.19
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              mkdir -p /preload
              {{- range $i, $f := .Values.jupyterlab.preload.notebooks }}
              cat >/preload/{{ $f.name | quote }} <<'EOF_{{ $i }}'
{{ $f.content | nindent 0 }}
EOF_{{ $i }}
              install -D -m 0644 /preload/{{ $f.name }} {{ $f.destPath }}
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /home/jovyan/work
        {{- end }}
        {{- if and .Values.jupyterlab.preload .Values.jupyterlab.preload.enabled (eq (lower (.Values.jupyterlab.preload.source | default "inline")) "image") (ne (default "" .Values.jupyterlab.preload.image) "") }}
        - name: preload-notebooks-image
          image: {{ .Values.jupyterlab.preload.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 100
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              DEST=/home/jovyan/work/examples
              mkdir -p "$DEST"
              if [ -d /assets ]; then
                # Copy all assets (notebooks, SQL fixtures, etc.) into examples
                cp -rf /assets/* "$DEST/" 2>/dev/null || true
                ls -l "$DEST" || true
              else
                echo "No /assets directory in preload image; nothing to copy." >&2
              fi
          volumeMounts:
            - name: data
              mountPath: /home/jovyan/work
        {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jupyterlab
          image: {{ .Values.jupyterlab.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: data
              mountPath: /home/jovyan/work
          env:
            {{- if .Values.jupyterlab.sso.enabled }}
            - name: NOTEBOOK_ARGS
              value: "--ServerApp.token='' --ServerApp.password=''"
            {{- end }}
          envFrom:
          {{- range $s := .Values.jupyterlab.envFromSecrets | default (list) }}
            - secretRef:
                name: {{ $s | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.jupyterlab.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jupyterlab-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyterlab
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- if .Values.jupyterlab.ingress.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," .Values.jupyterlab.ingress.middlewares | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ tpl (.Values.jupyterlab.hostTemplate | default (print "jupyter-" (index .Values "llmosaic-db").org ".tenants.llmosaic.ai")) . | quote }}
      secretName: {{ .Values.ingress.secretName | default "tenant-combined-tls" | quote }}
  rules:
    - host: {{ tpl (.Values.jupyterlab.hostTemplate | default (print "jupyter-" (index .Values "llmosaic-db").org ".tenants.llmosaic.ai")) . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ if .Values.jupyterlab.sso.enabled }}oauth2-proxy{{ else }}jupyterlab{{ end }}
                port:
                  number: {{ if .Values.jupyterlab.sso.enabled }}4180{{ else }}8888{{ end }}
{{- end }}
