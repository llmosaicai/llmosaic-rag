{{- if and .Values.rag .Values.rag.examples .Values.rag.examples.enabled (eq (lower (.Values.rag.examples.source | default "configmap")) "dvc") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-examples-seed-dvc
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: python:3.11-slim
          env:
            # Optional: users can mount a Secret and map envs for DVC remotes (AWS_*, AZURE_*, etc.)
            {{- range $k, $v := (index .Values.rag.examples "dvcEnv" | default dict) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir 'dvc[s3,azure]'
              mkdir -p /artifacts/specs /artifacts/notebooks
              PROV=/artifacts/specs/ASSETS_REMOTE.txt
              echo "# DVC assets fetched" > "$PROV"
              {{- range $f := .Values.rag.examples.dvc.files | default (list) }}
              echo "[dvc] get {{ $f.repo_url }}@{{ $f.repo_ref | default "main" }}:{{ $f.path }} -> {{ $f.to }}"
              tmpdir=$(mktemp -d)
              dvc get --rev {{ $f.repo_ref | default "main" | quote }} {{ $f.repo_url | quote }} {{ $f.path | quote }} -o "$tmpdir/out"
              dest={{ $f.to | quote }}
              mkdir -p "$(dirname "$dest")"
              mv "$tmpdir/out" "$dest"
              echo "{{ $f.to }} <- dvc: {{ $f.repo_url }}@{{ $f.repo_ref | default "main" }}:{{ $f.path }}" >> "$PROV"
              {{- end }}
              ls -l /artifacts /artifacts/specs || true
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: proxy-artifacts
{{- end }}
