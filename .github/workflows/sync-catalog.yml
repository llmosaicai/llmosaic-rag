name: Sync Catalog to Backends

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'config/catalog.yaml'
      - '.github/workflows/sync-catalog.yml'

jobs:
  sync-development:
    name: Sync to Development Backend
    if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests
      - name: Sync catalog (development)
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
          SYNC_EMAIL: ${{ secrets.BACKEND_SYNC_EMAIL }}
          SYNC_PASSWORD: ${{ secrets.BACKEND_SYNC_PASSWORD }}
        run: |
          python tools/sync_catalog.py

  sync-beta:
    name: Sync to Beta Backend
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_BETA_SYNC == 'true' }}
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests
      - name: Sync catalog (beta)
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
          SYNC_EMAIL: ${{ secrets.BACKEND_SYNC_EMAIL }}
          SYNC_PASSWORD: ${{ secrets.BACKEND_SYNC_PASSWORD }}
        run: |
          python tools/sync_catalog.py
