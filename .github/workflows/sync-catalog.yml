name: Sync Catalog to Backend

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'config/catalog.yaml'
      - '.github/workflows/sync-catalog.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests
      - name: Sync catalog
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
          SYNC_EMAIL: ${{ secrets.BACKEND_SYNC_EMAIL }}
          SYNC_PASSWORD: ${{ secrets.BACKEND_SYNC_PASSWORD }}
        run: |
          python tools/sync_catalog.py

